# pyproject.toml — метаданные проекта, зависимости, конфиги инструментов
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ntrip-accuracy-monitor"
version = "0.1.0"
description = "Мониторинг NTRIP-потока и NMEA-телеметрии ГНСС-приёмников EFT RS3 с расчётом метрик точности"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "ntrip-accuracy-monitor contributors" }]
keywords = ["gnss", "ntrip", "rtcm", "nmea", "rtk", "dgnss", "accuracy"]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
  "Framework :: AsyncIO",
]
dependencies = [
  "asyncpg>=0.30.0",
  "pydantic>=2.10",
  "pynmeagps>=1.0.43",
  "pyrtcm>=1.1.9",
  "pyproj>=3.7.0",
  "numpy>=2.2",
]

[project.optional-dependencies]
analysis = [
  "scipy>=1.15",
  "pandas>=2.2",
  "matplotlib>=3.10",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "mypy>=1.15",
  "ruff>=0.9",
]

[project.scripts]
ntrip-accuracy-monitor = "ntrip_accuracy_monitor.cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["ntrip_accuracy_monitor"]

# ----------------------------------------------------------------------------
# mypy — строгая проверка типов
# ----------------------------------------------------------------------------
[tool.mypy]
strict = true
packages = ["ntrip_accuracy_monitor"]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_reexport = true
show_error_codes = true

# Внешние библиотеки без py.typed — игнорируем отсутствие stubs.
# По мере появления типизации в апстриме записи отсюда будут удаляться.
[[tool.mypy.overrides]]
module = [
  "pynmeagps",
  "pynmeagps.*",
  "pyrtcm",
  "pyrtcm.*",
  "pygnssutils",
  "pygnssutils.*",
]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# ruff — линтер и форматтер
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL"]
ignore = [
  "RUF001", # ambiguous unicode chars in string literals
  "RUF002", # ambiguous unicode chars in docstrings
  "RUF003", # ambiguous unicode chars in comments
]

[tool.ruff.lint.per-file-ignores]
# В тестах разрешаем assert, магические числа и длинные функции.
"tests/**/*.py" = ["S101", "PLR2004", "PLR0915", "PLR0913"]

# ----------------------------------------------------------------------------
# pytest + pytest-asyncio
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
